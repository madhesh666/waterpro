<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Prediction</title>
<style>
body {
    font-family: Arial, sans-serif;
    padding: 20px;
    margin: 0;
    background: url('bg-water.jpg') no-repeat center center fixed;
    background-size: cover;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

form {
    backdrop-filter: blur(10px);
    background: rgba(255,255,255,0.25);
    border-radius: 15px;
    padding: 20px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 20px;
}

label {
    color: white;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.3);
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #4caf50;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #45a049;
}

/* Report Center */
#result {
    width: 100%;
    max-width: 900px;
    margin: 30px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* Water Report Card */
.report-card{
    background: rgba(255,255,255,0.95);
    color: #222;
    padding: 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 800px;
    margin: 20px auto;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.report-card h2{
    text-align:center;
    color:#0077cc;
    margin-bottom:20px;
}

.report-card p{
    font-size:18px;
    margin:12px 0;
}

/* Chart */
.chart-card {
    background: white;
    padding: 20px;
    border-radius: 20px;
    margin-top: 20px;
    width: 100%;
    height: 600px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}
</style>
    </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
<h1>Water Prediction</h1>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<form id="data-form">

    <label for="division">Select Division:</label>
    <select id="division" required>
        <option value="Division 1">Division 1</option>
        <option value="Division 2">Division 2</option>
    </select>

    <label for="area">Select Area:</label>
    <select id="area" required>
        <option value="">Select Area</option>
        <option value="Kumaran Nagar">Kumaran Nagar</option>
        <option value="Kurinji Nagar">Kurinji Nagar</option>
        <option value="Pakkamudayanpet">Pakkamudayanpet</option>
    </select>

    <label for="startDate">Start Date</label>
    <input type="date" id="startDate" required>

    <label for="endDate">End Date</label>
    <input type="date" id="endDate">

    <button type="submit">Fetch Data</button>

</form>

<div id="result"></div>
<script>

    let dataset = [];

fetch("10yr_processedd.json")
.then(response => response.json())
.then(data => {
    dataset = data;

    console.log("JSON Loaded");
    console.log(dataset);
    console.log("Total Records:", dataset.length);
})
.catch(error => {
    console.error("Error loading JSON:", error);
});
document.getElementById("data-form").addEventListener("submit", function(e){

    e.preventDefault();

    const division = document.getElementById("division").value;
    const area = document.getElementById("area").value;
    const startDate = document.getElementById("startDate").value;
    const endDate = document.getElementById("endDate").value;

    const resultDiv = document.getElementById("result");

    let filtered = dataset.filter(item=>{

        const d = new Date(item.Date);

        return (
            d >= new Date(startDate) &&
            (endDate==="" || d<=new Date(endDate))
        );

    });

    if(filtered.length===0){

        resultDiv.innerHTML="<h3>No data found.</h3>";

        return;

    }

if (endDate === "") {

    // Single Date Report
    const latest = filtered[filtered.length - 1];
resultDiv.innerHTML = `
<div class= "chart cardd">

    <h2>Water Report</h2>

    <p><strong>Division :</strong> ${division}</p>

    <p><strong>Area :</strong> ${area}</p>

    <p><strong>From :</strong> ${startDate}</p>

    <p><strong>To :</strong> ${endDate}</p>

   <p><strong>Water Connections :</strong> ${latest["Connection"]}</p>

<p><strong>Water Demand :</strong>
${Math.round(latest["Actual Limit (LPCD 135)"])} Litres</p>

<p><strong>Water Consumption:</strong>
${Math.round(latest["Consumption"])} Litres</p>

<p><strong>Report Generated :</strong>
${new Date().toLocaleString()}</p>

</div>

<div class="chart-cardd">
    <canvas id="myChart"></canvas>
</div>

`;
} else {

  const totalDemand = filtered.reduce(
(sum,item)=>sum + Number(item["Actual Limit (LPCD 135)"]),0);

const totalSupply = filtered.reduce(
(sum,item)=>sum + Number(item["Consumption"]),0);

    const averageSupply = Math.round(totalSupply / filtered.length);

    resultDiv.innerHTML = `
        <h2>Water Report</h2>

        <p><strong>Division :</strong> ${division}</p>

        <p><strong>Area :</strong> ${area}</p>

        <p><strong>From :</strong> ${startDate}</p>

        <p><strong>To :</strong> ${endDate}</p>

        <p><strong>Total Water Demand :</strong> ${Math.round(totalDemand)} Litres</p>

        <p><strong>Total Water Supplied :</strong> ${Math.round(totalSupply)} Litres</p>

        <p><strong>Average Supply :</strong> ${averageSupply} Litres/day</p>

        <div class="chart-card">
    <canvas id="myChart"></canvas>
</div>
    `;

    const labels = filtered.map(item => item.Date);
    const demand = filtered.map(
item => Number(item["Actual Limit (LPCD 135)"])
);
    const supply = filtered.map(
item => Number(item["Consumption"])
);

    const ctx = document.getElementById("myChart").getContext("2d");
    new Chart(ctx, {
        type: "line",
        data: {
            labels: labels,
            datasets: [
                {
                    label: "Demand (as per LPCD)",
                    data: demand,
                    borderColor: "blue",
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: "Water Supplied",
                    data: supply,
                    borderColor: "green",
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                zoom: {
                    pan: {
                        enabled: true,
                        mode: 'x'
                    },
                    zoom: {
                        wheel: {
                            enabled: true
                        },
                        pinch: {
                            enabled: true
                        },
                        mode: 'x'
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: false
                }
            }
        }
    });

} // end of else

}); 
</script>
</body>
</html>
